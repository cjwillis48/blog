apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: blog
  labels:
    app: ghost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ghost
  template:
    metadata:
      labels:
        app: ghost
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        storage-tier: large
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ghost
          image: ghcr.io/cjwillis48/blog:a7827e9  # Ghost 6.73.0; pinned so rollback = git revert
          imagePullPolicy: Always
          ports:
            - containerPort: 2368
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: mail__options__auth__pass
              valueFrom:
                secretKeyRef:
                  name: ghost-mail
                  key: password
            - name: storage__active
              value: S3Storage
            - name: storage__S3Storage__accessKeyId
              valueFrom:
                secretKeyRef:
                  name: ghost-storage-r2
                  key: access-key-id
            - name: storage__S3Storage__secretAccessKey
              valueFrom:
                secretKeyRef:
                  name: ghost-storage-r2
                  key: secret-access-key
            - name: storage__S3Storage__endpoint
              valueFrom:
                secretKeyRef:
                  name: ghost-storage-r2
                  key: endpoint-url
            - name: storage__S3Storage__region
              value: auto
            - name: storage__S3Storage__bucket
              value: blog-media
            - name: storage__S3Storage__forcePathStyle
              value: "true"
            # Ghost 6 built-in adapter. Existing images keep their absolute URLs
            # (bucket root, e.g. /2026/02/x.jpg); new uploads land under
            # content/images/YYYY/MM/ and are served from the same media domain.
            - name: storage__S3Storage__cdnUrl
              value: "https://media.blog.charliewillis.com"
            - name: storage__S3Storage__staticFileURLPrefix
              value: content/images
            - name: storage__S3Storage__multipartUploadThresholdBytes
              value: "26214400"   # 25 MiB
            - name: storage__S3Storage__multipartChunkSizeBytes
              value: "10485760"   # 10 MiB (adapter floor is 5 MiB)
          volumeMounts:
            - name: ghost-data
              mountPath: /var/lib/ghost/content
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /ghost/api/v4/admin/site/
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ghost/api/v4/admin/site/
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: ghost-data
          persistentVolumeClaim:
            claimName: ghost-data
